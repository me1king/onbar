<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Do or Drink</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8ec;--bg2:#fff;--card:#fff;--ink:#172033;--mute:#64748b;--line:#e2e8f0;--pink:#e11d48;--amb:#f59e0b;--grn:#16a34a;--vi:#6d28d9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg2);color:var(--ink);font:16px/1.4 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",Inter,sans-serif;margin:0}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.logo{font:800 44px/1 "Bricolage Grotesque",Inter;text-align:center;margin:14px 0 4px}
.logo b{color:var(--pink)}.logo i{font-style:normal;color:var(--amb)}
.sub{color:var(--mute);text-align:center;margin:0 0 16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
label.l{display:block;font-weight:700;margin-bottom:8px}
input[type=text]{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:12px;font:600 16px Inter}
button{font-family:inherit;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
.prow{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#120a2a;flex:none}
.x{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;width:38px;height:38px;font-size:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:99px;padding:9px 14px;font:700 14px Inter}
.chip[aria-pressed=true]{background:var(--vi);border-color:var(--vi);color:#fff}
.btn{width:100%;border:0;border-radius:16px;padding:16px;font:800 18px Inter;color:#120a2a;background:linear-gradient(90deg,var(--amb),var(--pink));min-height:56px}
.btn:disabled{background:#e2e8f0;color:#64748b;cursor:not-allowed}
.btn.g{background:var(--grn)}.btn.d{background:linear-gradient(90deg,var(--pink),#ff7a59);color:#fff}.btn.s{background:#fff;border:1px solid var(--line);color:var(--ink);font-size:15px;min-height:46px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.hint{color:var(--mute);font-size:13px}
.warn{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:10px 12px;font-size:13px;color:#9a3412;margin-top:10px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700}
.score{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.sc{flex:none;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 10px;text-align:center;font-size:12px}
.sc.on{border-color:var(--amb);box-shadow:0 0 14px #ffb02066}.sc b{display:block;font-size:14px}
.stage{min-height:340px}
.card{background:linear-gradient(160deg,#fff,#fff8ec);border:2px solid var(--vi);border-radius:26px;padding:22px;text-align:center;animation:flip .45s}
@keyframes flip{from{transform:rotateY(90deg) scale(.9);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
.tag{display:inline-block;border-radius:99px;padding:4px 14px;font:800 12px Inter;letter-spacing:.12em;text-transform:uppercase;background:var(--pink);color:#fff}
.tag.t{background:var(--vi)}.tag.g{background:var(--amb);color:#120a2a}.tag.w{background:#38bdf8;color:#04243a}
.who{font:800 38px/1.05 "Bricolage Grotesque",Inter;margin:14px 0 8px}
.txt{font:600 22px/1.3 Inter;margin:8px 0 6px}
.spin{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:20px 0}
.spin .sp{opacity:.35;transform:scale(.9);transition:.1s}.spin .sp.on{opacity:1;transform:scale(1.25)}
.sp .av{width:56px;height:56px;font-size:20px;margin:0 auto 4px}.sp div{font-size:12px;text-align:center}
.timer{font:800 56px "Bricolage Grotesque",Inter;color:#b45309;margin:6px 0}
.res{margin-top:12px;padding:10px;border-radius:12px;background:#f1f5f9;font-weight:600}
.awards .a{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse}td,th{padding:7px 4px;text-align:left;border-top:1px solid var(--line);font-size:14px}th{color:var(--mute);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">DO <i>or</i> <b>DRINK</b></div>
  <p class="sub" id="sub">The party game for 2 to 12 people</p>
  <div id="app"></div>
</div>
<script>
const $=s=>document.querySelector(s),COL=["#ffb020","#ff3d81","#22d3a0","#8b5cf6","#38bdf8","#fb7185","#a3e635","#f97316","#e879f9","#2dd4bf","#facc15","#60a5fa"];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const V={chill:"Chill hangout",house:"House party",date:"Date night",ke:"Kenyan vibes",team:"Team night"};
const P={
chill:{d:["Do your best impression of someone in this room. Let the group guess who.","Speak in a fake accent until your next turn.","Show the last photo in your gallery (you may pick any recent one).","Let the group pick a song and sing the chorus.","Do 10 jumping jacks while naming 10 foods.","Swap seats with the person on your left and stay there until your next turn.","Text 'I miss you' to the 3rd contact in your favourites (or show the chat).","Give a 20 second motivational speech about a spoon."],
 t:["What is the most embarrassing song you secretly love?","Who here would you trust to plan your wedding, and why?","What is the biggest lie you told as a kid?","What is your worst habit?","Which person here has the best style? Why?","What is the silliest thing you have cried about?","What was your most awkward date or meeting?","What is a talent you have that no one knows about?"],
 g:["Most likely to be late to their own party","Most likely to become famous","Most likely to forget their phone at home","Most likely to start a business and make it big"]},
house:{d:["Dance to the next song as if you are on stage in front of 10,000 people.","Do your best runway walk across the room.","Do a freestyle rap about the person to your right (keep it friendly).","Balance a spoon on your nose for 10 seconds.","Let someone pick a new nickname for you for the rest of the night.","Do the worm, or your best attempt, and own it.","Act out a movie scene. The group guesses the movie.","Tell a joke. If nobody laughs, you take the forfeit."],
 t:["What is the wildest party you have been to?","What is the funniest thing you did while tipsy or sleepy?","What is the most embarrassing thing in your search history that you can share?","Who in this room is the best dancer, and who is the worst?","What is your go-to party trick?","What is your guilty pleasure TV show?","Have you ever pretended to like a gift? What was it?","What was your most memorable house party moment?"],
 g:["Everyone: first to touch their nose is safe, the last one forfeits","Most likely to fall asleep on the couch","Most likely to be the last to leave","Vote: who is the best dancer here?"]},
date:{d:["Give your partner a 30 second shoulder rub.","Say three things you love about the person to your right.","Recreate how you two first met, as a short scene.","Look into the eyes of the person across from you for 15 seconds without laughing.","Slow dance with the person of your choice for 20 seconds.","Write a short poem about tonight and read it aloud.","Describe your partner using only emojis (act them out).","Plan the perfect date in 20 seconds."],
 t:["What was your first impression of the other person?","What is one thing you want us to do together this year?","What is your favourite memory of us so far?","What is something small I do that you love?","What is a dream you have not told many people about?","What song reminds you of us?","What is the best meal you have ever had, and who was there?","If we could travel anywhere tomorrow, where?"],
 g:["Who here would be the best at keeping a secret?","Most likely to say 'I love you' first","Most romantic person in the room","Vote: best couple in this room"]},
ke:{d:["Do your best dance to a Gengetone beat. The group picks the song.","Say 'Sasa' in ten different tones in 15 seconds.","Do a convincing matatu conductor impression, shouting the stages.","Say a Sheng sentence and have someone translate it (or take the forfeit).","Act like a Nairobi traffic cop at a roundabout for 20 seconds.","Sell the nearest object like a street hawker on Moi Avenue.","Name five Kenyan musicians in 10 seconds.","Do your best Swahili news anchor voice reading a food menu."],
 t:["What is the best street food in Nairobi, and where?","What is the funniest thing a Kenyan relative ever said to you?","What is your most embarrassing matatu moment?","Which Kenyan slang word do you overuse?","What is the one Kenyan dish you could eat every day?","Who is your all-time favourite Kenyan artist?","What is the best part of living in your area?","What is the worst advice you ever got from an uncle?"],
 g:["Most likely to bargain at a supermarket","Most likely to say 'niko kwa road' while still at home","Best Sheng speaker in the room","Vote: who would survive a Nairobi Friday traffic jam best?"]},
team:{d:["Give a 20 second pitch for a ridiculous product the group names.","Do a robot impression of your boss (kind version).","Teach the group one useful thing in 20 seconds.","Say something nice about every person at the table.","Do a dramatic reading of the last work email you sent.","Mime your job and let the group guess.","Name every person in the room and one thing you like about them.","Do a victory dance for the team's last win."],
 t:["What is your best memory working here?","What is the weirdest job you ever had?","What would you do if you were CEO for a day?","What is one thing you would change about our workplace?","What skill do you want to learn this year?","Who taught you the most at work?","What is your favourite thing about this team?","What is your dream holiday?"],
 g:["Most likely to reply 'per my last email'","Most likely to be the next boss","Best at meetings that could have been emails","Vote: who deserves a day off?"]}};
const FORF=["Do 5 squats.","Say something nice about the person on your left.","Tell the group a harmless secret.","Do your best animal impression.","Hold a plank for 15 seconds.","Dance for 10 seconds.","Sing the first line of any song.","Give the group a compliment each."];
const WATER=["Water break! Pause for a glass of water and a snack.","Hydration time 💧 Take a water break, then carry on.","Snack check 🍟 Grab a snack and some water before the next round."];
const requestedMode=new URLSearchParams(location.search).get("drinkMode");
let S={scr:"setup",pl:["","",""],vibe:"house",rounds:3,cap:2,alc:requestedMode!=="none",soft:requestedMode==="soft",adult:false};
let G=null;
let gameBreakAd=null,gameBreakSuggestion=null,gameBreakAdError="";
function renderBreakAd(){
 const box=$("#breakAd");if(!box)return;box.replaceChildren();box.classList.add("hide");
 if(gameBreakAdError){box.classList.remove("hide");box.textContent=gameBreakAdError;return}
 const item=gameBreakAd||gameBreakSuggestion;if(!item)return;
 box.classList.remove("hide");
 const sponsored=document.createElement("span");sponsored.className="tag w";sponsored.textContent=gameBreakAd?"Sponsored":"Suggested";box.append(sponsored);
 if(item.headline){const headline=document.createElement("strong");headline.textContent=item.headline;box.append(headline)}
 if(item.showImage&&typeof item.imageUrl==="string"&&(item.imageUrl.startsWith("/")||/^https:\/\//i.test(item.imageUrl))){
  const image=document.createElement("img");image.src=item.imageUrl;image.alt="";image.loading="lazy";image.style.cssText="display:block;width:100%;max-height:140px;object-fit:cover;border-radius:10px;margin:8px 0";box.append(image)
 }
 if(item.showProductName){const name=document.createElement("div");name.textContent=item.productName;box.append(name)}
 if(item.message){const message=document.createElement("div");message.textContent=item.message;box.append(message)}
 if(item.price!==null){const price=document.createElement("div");price.textContent=`KES ${Number(item.price).toLocaleString()}`;box.append(price)}
 const link=document.createElement("a");link.href=`/product/${encodeURIComponent(item.productId)}`;link.textContent=item.ctaLabel;link.style.color="#6d28d9";link.style.fontWeight="700";box.append(link)
}
window.addEventListener("message",event=>{
 if(event.source!==window.parent||event.data?.type!=="onlinebar:game-break-ad")return;
 const validCard=item=>item&&Number.isSafeInteger(item.productId)&&typeof item.productName==="string"
  &&(item.price===null||(typeof item.price==="number"&&Number.isFinite(item.price)&&item.price>=0))&&(item.imageUrl===null||typeof item.imageUrl==="string")
  &&typeof item.headline==="string"&&typeof item.message==="string"&&typeof item.showImage==="boolean"
  &&typeof item.showProductName==="boolean"&&typeof item.ctaLabel==="string";
 gameBreakAd=validCard(event.data.ad)?event.data.ad:null;
 gameBreakSuggestion=validCard(event.data.suggestion)?event.data.suggestion:null;
 gameBreakAdError=typeof event.data.error==="string"?event.data.error:"";
 renderBreakAd()
});
function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function av(n,i){return `<div class="av" style="background:${COL[i%12]}">${esc((n||"?").trim().charAt(0).toUpperCase())}</div>`}
function setup(){
 $("#sub").textContent="The party game for 2 to 12 people";
 $("#app").innerHTML=`<div class="panel"><label class="l">Who is playing? (${S.pl.length}/12)</label>${S.pl.map((p,i)=>`<div class="prow">${av(p,i)}<input type="text" data-i="${i}" value="${esc(p)}" maxlength="14" placeholder="Player ${i+1}" aria-label="Player ${i+1} name"><button class="x" data-rm="${i}" aria-label="Remove player ${i+1}" ${S.pl.length<=2?"disabled":""}>×</button></div>`).join("")}${S.pl.length<12?`<button class="btn s" data-add="1">+ Add player</button>`:""}</div>
 <div class="panel"><label class="l">Pick the vibe</label><div class="chips">${Object.entries(V).map(([k,v])=>`<button class="chip" data-v="${k}" aria-pressed="${S.vibe===k}">${v}</button>`).join("")}</div></div>
 <div class="panel"><label class="l">Rounds (turns each)</label><div class="chips">${[2,3,5,8].map(n=>`<button class="chip" data-r="${n}" aria-pressed="${S.rounds===n}">${n}</button>`).join("")}</div>
 <label class="l" style="margin-top:14px">Drink mode for this game</label><div class="chips"><button class="chip" data-mode="shots" aria-pressed="${S.alc&&!S.soft}">Take a shot (optional)</button><button class="chip" data-mode="soft" aria-pressed="${S.alc&&S.soft}">Soft drinks only</button><button class="chip" data-mode="none" aria-pressed="${!S.alc}">No alcohol (forfeits)</button></div>
 ${S.alc&&!S.soft?`<label class="l" style="margin-top:14px">Shot limit per person</label><div class="chips">${[1,2].map(n=>`<button class="chip" data-cap="${n}" aria-pressed="${S.cap===n}">${n} ${n===1?"shot":"shots"}</button>`).join("")}</div>
 <label style="display:flex;gap:10px;align-items:center;margin-top:14px"><input type="checkbox" id="adult" ${S.adult?"checked":""} style="width:22px;height:22px"> Everyone playing is 18 or older and legally allowed to drink</label>`:""}
 <div class="warn">Choose the drink mode before the first turn. Shot mode is optional and capped at two shots per player. Soft drinks appear only if selected above. Everyone may pass without drinking. Never pressure anyone or drive after drinking.</div></div>
 <button class="btn" data-start="1" ${ok()?"":"disabled"}>${ok()?"Start the game 🎉":"Add at least 2 names"+(S.alc&&!S.soft&&!S.adult?" and confirm legal age":"")}</button>`}
const ok=()=>S.pl.filter(p=>p.trim()).length>=2&&(!S.alc||S.soft||S.adult);
function start(){
 const names=S.pl.map(p=>p.trim()).filter(Boolean).slice(0,12);
 G={p:names.map(n=>({n,sips:0,forf:0,done:0,pass:0,turns:0})),deck:{d:shuf(P[S.vibe].d),t:shuf(P[S.vibe].t),g:shuf(P[S.vibe].g)},q:[],round:1,turn:0,cur:-1,card:null,res:"",timer:0,ti:null,fq:shuf(FORF),wq:shuf(WATER),max:names.length*S.rounds};
 S.scr="play";next()}
function draw(k){if(!G.deck[k].length)G.deck[k]=shuf(P[S.vibe][k]);return G.deck[k].pop()}
function forf(){if(!G.fq.length)G.fq=shuf(FORF);return G.fq.pop()}
async function next(){
 if(G.turn>=G.max)return end();
 if(G.turn>0&&G.turn%5===0&&!G.water){G.water=1;G.card={type:"w",text:G.wq.length?G.wq.pop():WATER[0]};G.cur=-1;G.res="";return play()}
 G.water=0;
 if(!G.q.length)G.q=shuf(G.p.map((_,i)=>i));
 const pick=G.q.pop();G.card=null;G.res="";clearInterval(G.ti);G.timer=0;
 play(true);
 if(!matchMedia("(prefers-reduced-motion:reduce)").matches){let i=0,steps=18+Math.floor(Math.random()*G.p.length);for(let s=0;s<steps;s++){i=(i+1)%G.p.length;mark(i);await new Promise(r=>setTimeout(r,60+s*s*.45))}}
 G.cur=pick;G.p[pick].turns++;G.turn++;
 const r=Math.random(),type=r<.42?"d":r<.8?"t":"g";
 G.card={type,text:draw(type),ev:type==="g"&&Math.random()<.5};
 play()}
function mark(i){document.querySelectorAll(".sp").forEach((e,j)=>e.classList.toggle("on",j===i))}
function limit(p){return S.alc&&!S.soft&&p.sips>=S.cap}
function play(spinning){
 $("#sub").textContent=V[S.vibe]+(S.alc?(S.soft?" · soft drinks":" · shots mode"):" · no alcohol");
 const c=G.card,p=G.p[G.cur],rd=Math.min(S.rounds,Math.floor((G.turn-1)/G.p.length)+1);
 let main="";
 if(spinning||!c)main=`<h3 style="text-align:center">Who's next?</h3><div class="spin">${G.p.map((q,i)=>`<div class="sp">${av(q.n,i)}<div>${esc(q.n)}</div></div>`).join("")}</div>`;
 else if(c.type==="w")main=`<div class="card"><span class="tag w">Water break</span><div class="txt" style="margin-top:14px">${esc(c.text)}</div><div id="breakAd" class="res hide" aria-live="polite"></div></div><div class="two"><button class="btn g" style="grid-column:span 2" data-go="1">Done, keep playing</button></div>`;
 else{const lab={d:"Dare",t:"Truth",g:"Group"}[c.type],cl=c.type==="d"?"":c.type==="t"?"t":"g";
  const everyone=c.type==="g"&&/^Everyone/.test(c.text),vote=c.type==="g"&&!everyone;
  main=`<div class="card"><span class="tag ${cl}">${lab}</span><div class="who">${c.type==="g"?"Everyone!":esc(p.n)}</div><div class="txt">${esc(c.text)}</div>
  ${c.type==="d"?`<div class="timer" id="tm">${G.timer?G.timer:""}</div><button class="btn s" data-timer="1" style="width:auto;padding:8px 18px;min-height:38px">Start 20s timer</button>`:""}
  ${G.res?`<div class="res">${G.res}</div>`:""}</div>
  ${G.res?`<button class="btn g" style="margin-top:12px" data-go="1">Next ➜</button>`:
   vote?`<p class="hint" style="text-align:center;margin-top:12px">Count to 3 and point. Tap who got the most votes:</p><div class="chips" style="justify-content:center">${G.p.map((q,i)=>`<button class="chip" data-vote="${i}">${esc(q.n)}</button>`).join("")}</div>`:
   everyone?`<p class="hint" style="text-align:center;margin-top:12px">Everyone does it at the same time. Tap the person who lost:</p><div class="chips" style="justify-content:center">${G.p.map((q,i)=>`<button class="chip" data-vote="${i}">${esc(q.n)}</button>`).join("")}</div><button class="btn s" data-go="1" style="margin-top:10px">Skip this one</button>`:
   `<div class="two"><button class="btn g" data-do="1">${c.type==="d"?"I did it ✅":"I answered ✅"}</button><button class="btn d" data-drink="1">${S.alc&&!limit(p)?(S.soft?"Take a soft drink 🥤":"Take a shot 🥃"):"Forfeit 🥤"}</button></div>
   <div class="two" style="margin-top:8px"><button class="btn s" data-pass="1">Pass (no drink)</button><button class="btn s" data-unsafe="1">Not comfortable</button></div>
   ${limit(p)?`<p class="hint" style="text-align:center">${esc(p.n)} reached the shot limit. Forfeits only now; passing is always okay. 💧</p>`:""}`}`}
 $("#app").innerHTML=`<div class="bar"><span>Round ${Math.min(rd,S.rounds)} of ${S.rounds}</span><span>Turn ${Math.min(G.turn,G.max)}/${G.max}</span><button class="chip" data-end="1" style="padding:6px 12px">End game</button></div>
 <div class="score">${G.p.map((q,i)=>`<div class="sc ${i===G.cur?"on":""}"><span>${esc(q.n)}</span><b>${S.alc?q.sips+(S.soft?" 🥤":" 🥃"):q.forf+" 🥤"} · ${q.done} ✅</b></div>`).join("")}</div><div class="stage">${main}</div>`;
 if(!spinning&&c?.type==="w")renderBreakAd()}
function take(i,why){const p=G.p[i];if(S.alc&&!limit(p)){p.sips++;return `${esc(p.n)} takes ${S.soft?"a soft drink 🥤":"a shot 🥃"}${why||""}`}p.forf++;return `${esc(p.n)} does a forfeit: ${forf()}`}
function end(){
 clearInterval(G.ti);S.scr="end";const a=G.p,mx=(f)=>a.slice().sort((x,y)=>f(y)-f(x))[0];
 $("#sub").textContent="Game over";
 $("#app").innerHTML=`<div class="panel awards"><h2 style="font-size:26px;margin-bottom:6px">🏆 Results</h2>
 <div class="a"><span>Bravest (most dares and answers)</span><b>${esc(mx(x=>x.done).n)} · ${mx(x=>x.done).done}</b></div>
 <div class="a"><span>${S.alc?(S.soft?"Soft drinks":"Shots"):"Forfeits"}</span><b>${esc(mx(x=>S.alc?x.sips:x.forf).n)}</b></div>
 <div class="a"><span>Passes used</span><b>${esc(mx(x=>x.pass).n)} · ${mx(x=>x.pass).pass}</b></div></div>
 <div class="panel"><table><tr><th>Player</th><th>Done</th><th>${S.alc?(S.soft?"Soft drinks":"Shots"):"Forfeits"}</th><th>Passes</th></tr>${a.map(p=>`<tr><td>${esc(p.n)}</td><td>${p.done}</td><td>${S.alc?p.sips:p.forf}</td><td>${p.pass}</td></tr>`).join("")}</table></div>
 <button class="btn" data-again="1">Play again</button><div class="warn">Hungry after all that? Order snacks and drinks from Online Bar. 18+ for alcohol. Please drink responsibly and never drive after drinking.</div>`}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(S.scr==="setup"){
  if(d.add&&S.pl.length<12)S.pl.push("");if(d.rm!==undefined&&S.pl.length>2)S.pl.splice(+d.rm,1);
  if(d.v)S.vibe=d.v;if(d.r)S.rounds=+d.r;if(d.mode){S.alc=d.mode!=="none";S.soft=d.mode==="soft";if(!S.alc||S.soft)S.adult=false}if(d.cap)S.cap=+d.cap;
  if(d.start&&ok())return start();return setup()}
 if(S.scr==="end"&&d.again){S.scr="setup";return setup()}
 if(!G||S.scr!=="play")return;const p=G.p[G.cur],c=G.card;
